name: CI

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:

# Superseded runs on the same ref are pointless; keep master runs though, they gate the
# docs deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  # Single place to bump the version used by the jobs that do not need the matrix.
  DEFAULT_PYTHON: '3.12'

jobs:
  quality:
    name: Lint and code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: true

      - name: Install dependencies
        run: pdm install --dev

      # `select = ["ALL"]` includes the S (bandit) rules, so this step is also the
      # static security check on our own code.
      - name: Lint
        run: pdm run lint

      - name: Code style
        run: pdm run format-check

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      # The audio fixtures live in Git LFS and checkout skips them by default, which
      # leaves pointer files on disk and makes anything that inspects audio content
      # silently wrong.
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: true

      - name: Install dependencies
        run: pdm install --dev

      - name: Run tests
        run: pdm run test

      - name: Upload coverage to Codecov
        if: matrix.python-version == env.DEFAULT_PYTHON
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: docs/_build/coverage/coverage.xml
          fail_ci_if_error: false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.python-version }}
          path: docs/_build/test-reports/
          retention-days: 14

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: true

      - name: Install dependencies
        run: pdm install --dev

      # Runtime, dev and docs dependencies in one resolved, de-duplicated list.
      - name: Export the resolved dependency set
        run: pdm export -dG:all -f requirements --without-hashes -o requirements-audit.txt

      - name: Audit dependencies
        run: |
          pdm run pip-audit \
            --requirement requirements-audit.txt --no-deps --disable-pip \
            --format=json --output=audit.json || true
          test -f audit.json

      # Turns the raw JSON into a table in the run summary, and fails the job only when a
      # fixed version exists upstream.
      - name: Report
        run: pdm run python .github/scripts/audit_report.py audit.json

      - name: Build SBOM
        if: always()
        run: |
          pdm run pip-audit \
            --requirement requirements-audit.txt --no-deps --disable-pip \
            --format=cyclonedx-json --output=sbom.json || true

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit
          path: |
            audit.json
            sbom.json
            requirements-audit.txt
          retention-days: 30

  docs:
    name: Build and deploy docs
    if: github.ref == 'refs/heads/master'
    needs: [quality, test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: true

      - name: Install dependencies
        run: pdm install -G docs

      - name: Build docs
        run: pdm run docs-build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, test, security]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vericlient
    permissions:
      contents: write    # create the GitHub release
      id-token: write    # PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v7

      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: true

      - name: Install dependencies
        run: pdm install --dev

      - name: Build package
        run: pdm run build

      # No API token: PyPI verifies the workflow's OIDC identity instead.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
