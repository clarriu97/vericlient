[project]
name = "vericlient"
version = "0.1.6"
description = "Provides a simple and robust interaction with Veridas APIs."
authors = [
    {name = "Carlos Larriu", email = "larriucarlos@gmail.com"},
]
dependencies = [
    "pydantic>=2.13",
    "structlog>=25.4",
    "requests>=2.34.2",
    "dynaconf>=3.3.5",
]
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://clarriu97.github.io/vericlient/"
Documentation = "https://clarriu97.github.io/vericlient/api_docs/vericlient/"
Repository = "https://github.com/clarriu97/vericlient"
Issues = "https://github.com/clarriu97/vericlient/issues"
Changelog = "https://github.com/clarriu97/vericlient/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "ruff>=0.16",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-html>=4.2",
    "requests-mock>=1.12.1",
    "build>=1.3",
    "twine>=7.0",
    "pip-audit>=2.9",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.7",
    "mkdocstrings[python]>=1.0",
]

[tool.pdm.scripts]
lint = "ruff check ."
lint-fix = "ruff check . --fix"
format = "ruff format ."
format-check = "ruff format --check ."
docs-serve = "mkdocs serve"
docs-build = "mkdocs build"
audit = { shell = """
    pdm export --no-default -dG:all -f requirements --without-hashes -o /tmp/vericlient-audit.txt \
    && pdm export -f requirements --without-hashes >> /tmp/vericlient-audit.txt \
    && pip-audit --requirement /tmp/vericlient-audit.txt --no-deps --disable-pip
    """ }
test = """pytest tests --mock \
    --cov src/vericlient \
    --cov-report term --cov-fail-under 80 \
    --cov-report html:docs/_build/coverage \
    --cov-report xml:docs/_build/coverage/coverage.xml \
    --html=docs/_build/test-reports/index.html \
    --junitxml=docs/_build/test-reports/junit.xml \
    -o junit_suite_name=test"""
test-eu-sandbox = { shell = """
    pytest tests --env EU_SANDBOX -m $SERVICE \
    --html=docs/_build/test-reports/index.html \
    --junitxml=docs/_build/test-reports/junit.xml \
    -o junit_suite_name=test
    """ }
test-us-sandbox = { shell = """
    pytest tests --env US_SANDBOX -m $SERVICE \
    --html=docs/_build/test-reports/index.html \
    --junitxml=docs/_build/test-reports/junit.xml \
    -o junit_suite_name=test
    """ }
test-eu-production = { shell = """
    pytest tests --env EU_PRODUCTION -m $SERVICE \
    --html=docs/_build/test-reports/index.html \
    --junitxml=docs/_build/test-reports/junit.xml \
    -o junit_suite_name=test
    """ }
test-us-production = { shell = """
    pytest tests --env US_PRODUCTION -m $SERVICE \
    --html=docs/_build/test-reports/index.html \
    --junitxml=docs/_build/test-reports/junit.xml \
    -o junit_suite_name=test
    """ }
build = "python -m build"
publish = "twine upload dist/*"

[tool.ruff]
line-length = 130
indent-width = 4
target-version = "py311"
extend-exclude = ["docs/_build", "site"]

[tool.ruff.lint]
fixable = ["ALL"]
select = ["ALL"]
ignore = [
    "CPY001",   # Missing copyright notice at top of file
    "D107",     # Missing docstring in `__init__`
    "D106",     # Missing docstring in public nested class
    "PTH123",   # `open()` should be replaced by `Path.open()`
    "PLR0913",  # Too many arguments in function definition
    "PLR0917",  # Too many positional arguments
    "PTH118",   # `os.path` should be replaced by `pathlib.Path`
    "PTH120",   # `os.path.dirname()` should be replaced by `Path.parent`
    "D203",     # 1 blank line required before class docstring
    "D213",     # multi-line-summary-second-line
    "D406",     # Section name should end with a newline
    "D407",     # Missing dashed underline after section
    "PTH119",   # `os.path.basename()` should be replaced by `Path.name`
]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "S101",     # Use of assert detected
    "ANN001",   # Missing type annotation for function argument
    "ANN201",   # Missing type annotation for public function
    "D100",     # Missing docstring in public module
    "D103",     # Missing docstring in public function
    "D104",     # Missing docstring in public package
]
"scripts/*.py" = [
    "INP001",   # File is part of an implicit namespace package
    "T201",     # `print` found: example scripts are meant to print
    "D100",     # Missing docstring in public module
    "S311",     # Pseudo-random generators are fine in examples
]

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pytest.ini_options]
markers = [
    "vcsp: marks tests as VCSP (deselect with '-m \"not vcsp\"')",
    "daspeak: marks tests as DASPEAK (deselect with '-m \"not daspeak\"')",
]
